version: 2
updates:
  - package-ecosystem: deno
    directories:
      - "/"
      - "/examples"
    schedule:
      interval: weekly
    # /examples no longer pins the 5 preset packages (they come through
    # dist/index.ts), but some packages (e.g. the textlint-related 15.x
    # packages) still appear in both / and /examples. Group updates by
    # dependency name so that any such shared package is bumped in both
    # directories within a single PR.
    groups:
      deno-dependencies:
        group-by: dependency-name
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
