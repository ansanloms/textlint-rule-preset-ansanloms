version: 2
updates:
  - package-ecosystem: deno
    directories:
      - "/"
      - "/examples"
    schedule:
      interval: weekly
    # The 5 preset packages are pinned as `npm:` specifiers in deps.ts, which
    # Dependabot's deno support does not read (only deno.json imports +
    # deno.lock), so they are not managed here. The deno entry covers the
    # deno.json deps: test deps at the root, textlint itself in /examples.
    # Currently no dependency name is shared between / and /examples, so this
    # grouping is a no-op; it is kept so that a package added to both
    # directories later is bumped in a single PR.
    groups:
      deno-dependencies:
        group-by: dependency-name
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
